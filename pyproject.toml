[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transformer_design"
version = "0.1.0"
description = "Üç Fazlı Dağıtım Transformatörü Matematik ve Ön Tasarım Kütüphanesi"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "Pint>=0.23"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
